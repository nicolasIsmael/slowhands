<!doctype html>
<html lang="en">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1c1917" />
    <title>SlowHands</title>
    <style>

    <div id="splash" aria-hidden="true"><span></span></div>
